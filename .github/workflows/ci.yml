name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rubberband-cli libsndfile1 fonts-noto-cjk libxml2-utils
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg rubberband
      - run: uv sync --locked --extra tracking --extra pose-tracking --extra beat-analysis --extra retime-audio
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run python scripts/package_release.py --output dist
      - run: uv run --no-sync python scripts/verify_release_artifacts.py dist --output release-audit.json
      - run: uv run --no-sync python scripts/smoke_wheel.py dist/video_edit_harness-*-py3-none-any.whl
